:root{color-scheme:dark;--bg:#0c0a08;--sf:#151109;--s2:#1d1810;--ink:#e6d9b8;--mut:#a09068;--line:#4a3d24;--gold:#c9a45c;--a1:#ecd08f;--a2:#b8893a;--on:#1a1207;--ok:#7ccf6a;--bad:#e5534b;--sp:linear-gradient(90deg,#8b3fd6,#3b6be0,#2fb4e0,#3fbf5f,#f2d13c,#f08a24,#e5322d);--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"DejaVu Serif",serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#050403;color:var(--ink);font:16px/1.4 var(--serif);display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
main::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,164,92,.45);pointer-events:none;z-index:2;background:radial-gradient(circle at 0 0,var(--gold) 2px,transparent 3px),radial-gradient(circle at 100% 0,var(--gold) 2px,transparent 3px),radial-gradient(circle at 0 100%,var(--gold) 2px,transparent 3px),radial-gradient(circle at 100% 100%,var(--gold) 2px,transparent 3px)}
main{width:100%;max-width:440px;padding:24px 20px;display:flex;flex-direction:column;position:relative;background:linear-gradient(180deg,rgba(8,7,5,var(--o1,.5)),rgba(8,7,5,var(--o2,.8))),var(--wp) center top/cover no-repeat;box-shadow:0 0 0 1px rgba(201,164,92,.2),0 30px 80px rgba(0,0,0,.7)}
main.play{--o1:.8;--o2:.92}
section{display:none;flex:1;flex-direction:column;gap:14px}
section.on{display:flex}
p{margin:0}h1{margin:0;font-size:1.9rem;font-style:italic;font-weight:400;letter-spacing:-.01em}
h2{margin:0 0 10px;font-size:.68rem;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.sub,.rec{color:var(--mut);font-style:italic}.rec{text-align:center}
.g{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{display:flex;align-items:center;gap:12px;padding:8px 0}
.logo{flex:none;width:56px;height:56px}
.card{background:linear-gradient(180deg,rgba(255,240,200,.05),transparent),rgba(16,13,9,.74);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;color:inherit;background:rgba(29,24,16,.86);border:1px solid var(--line);border-radius:10px;padding:11px;cursor:pointer;touch-action:manipulation;user-select:none;transition:transform .08s}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.chip[aria-pressed=true]{color:var(--on);border-color:transparent;font-weight:700;background:linear-gradient(135deg,var(--a1),var(--a2))}
.op{font-size:1.25rem;padding:8px 0}
#ops{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
sup{font-size:.5em;vertical-align:.9em;color:var(--a1)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;text-align:left}
.sw small,.mode small{display:block;color:var(--mut);font-style:italic}
.sw i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:.2s}
.sw[aria-checked=true] i{background:linear-gradient(90deg,var(--a1),var(--a2))}
.sw[aria-checked=true] i::after{transform:translateX(18px);background:var(--on)}
.modes{display:grid;gap:8px}
.mode{display:flex;align-items:center;gap:12px;text-align:left}
.bd{flex:none;width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-style:italic;font-weight:700;background:var(--sf);border:1px solid var(--line)}
.mode[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.mode[aria-pressed=true] .bd{color:var(--on);border-color:transparent;background:linear-gradient(135deg,var(--a1),var(--a2))}
.cta{border:0;color:var(--on);font-weight:700;font-size:1.1rem;letter-spacing:.04em;padding:16px;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 28px rgba(201,164,92,.22)}
.ghost{background:transparent}
.wave{width:100%;height:20px;color:var(--line)}
.cap{text-align:center;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);opacity:.7}
.top{display:flex;align-items:center;gap:10px}
.top b{flex:1;font-size:1.5rem;font-style:italic;font-weight:400;font-variant-numeric:tabular-nums}
.top #sc{color:var(--a1)}
.ic{padding:8px 12px}
.bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:3px;background:var(--sp)}
.bar.low i{background:var(--bad)}
.qc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:radial-gradient(70% 55% at 50% 40%,rgba(160,120,60,.16),transparent),rgba(14,11,8,.78);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:16px}
#qt{font-size:clamp(2.6rem,14vw,4rem);font-style:italic;font-weight:400;color:#f0e4c4;text-shadow:0 0 26px rgba(232,201,135,.25);font-variant-numeric:tabular-nums}
.o{color:var(--a1)}
#an{font-size:clamp(2rem,10vw,3rem);font-style:italic;min-width:60%;min-height:1.3em;color:var(--a1);border-bottom:1px solid var(--gold);font-variant-numeric:tabular-nums}
#an::after{content:"";display:inline-block;width:2px;height:.9em;margin-left:3px;vertical-align:-.08em;background:var(--a1);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#st{min-height:1.4em;color:var(--mut);font-size:.95rem;font-style:italic}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:60px;font-size:1.6rem;background:rgba(18,14,10,.88);border-radius:12px;box-shadow:0 3px 0 #070504;font-variant-numeric:tabular-nums}
.pad button:active{box-shadow:none;transform:translateY(3px)}
.pad [data-k=b],.pad [data-k=","]{background:var(--s2);color:var(--a1)}
.pad .off{opacity:.3}
.qc.ok{animation:ok .35s}.qc.bad{animation:bad .35s}
@keyframes ok{40%{box-shadow:0 0 0 2px var(--ok),0 0 34px rgba(255,236,190,.35)}}
@keyframes bad{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}30%{box-shadow:0 0 0 2px var(--bad)}}
@media(prefers-reduced-motion:reduce){.qc.ok,.qc.bad,#an::after{animation:none}}
.res{text-align:center}
.big{font-size:4.4rem;font-style:italic;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:99px;font-weight:700;color:var(--on);background:linear-gradient(135deg,var(--a1),var(--a2))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:rgba(16,13,9,.74);border:1px solid var(--line);border-radius:10px;padding:12px}
.stats div:last-child:nth-child(odd){grid-column:1/-1}
.stats b{display:block;font-size:1.6rem;font-style:italic;font-weight:400;color:var(--a1);font-variant-numeric:tabular-nums}
.stats span{color:var(--mut);font-size:.85rem}
#rv{text-align:left}#rv div{padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
#again{margin-top:auto}
.side{display:contents}
.panel{display:none}
#top5box{display:none}
.who{display:flex;align-items:center;gap:10px;font-size:.9rem}
.who[hidden]{display:none}
.who #nick{flex:1;font-style:italic;color:var(--a1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who a,.lk{color:inherit;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:rgba(29,24,16,.86)}
.lk{display:block;text-align:center;padding:11px}
#sent{min-height:1.4em}
button:disabled{opacity:.35;cursor:default}
#hint{max-width:100%;padding:8px 12px;text-align:left;font-style:italic;font-size:.95rem;color:var(--ink);background:rgba(201,164,92,.08);border-left:2px solid var(--gold);border-radius:0 8px 8px 0}
#hint:empty{display:none}
select.lang{width:auto;align-self:center;font:inherit;font-size:.85rem;color:var(--mut);background:rgba(29,24,16,.86);border:1px solid var(--line);border-radius:10px;padding:6px 10px}

/* Mental Math — layout para PC (telas largas). Carregado só quando a janela tem 1200px ou mais. */
body{background:linear-gradient(180deg,rgba(5,4,3,.58),rgba(5,4,3,.84)),var(--pcbg) center/cover fixed no-repeat;display:block}
body.play{background-image:linear-gradient(180deg,rgba(5,4,3,.8),rgba(5,4,3,.93)),var(--pcbg)}
main{max-width:1240px;margin:0 auto;padding:36px 56px;background:none;box-shadow:none;min-height:100vh}
main::before{position:fixed;inset:14px}
.brand,.who,.rec,.cap,.top h1{text-shadow:0 1px 10px rgba(0,0,0,.85)}
@media (hover:hover){button:hover:not(:disabled),.btn:hover,.lk:hover,.who a:hover{border-color:var(--gold)}}
@media (min-width:1600px){main{max-width:1440px}.pg-game #qt{font-size:6rem}}

/* ---- jogo ---- */
.pg-game .brand .logo{width:72px;height:72px}
.pg-game h1{font-size:2.6rem}
.pg-game #home.on{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px 36px;align-content:start}
.pg-game #home .brand{grid-column:1;grid-row:1}
.pg-game #home .who{grid-column:2;grid-row:1;justify-self:end;align-self:center}
.pg-game #home>.card{grid-column:1}
.pg-game #home .side{grid-column:2;grid-row:2/span 3;display:flex;flex-direction:column;gap:16px}
.pg-game .rec{text-align:left;font-size:1.05rem}
.pg-game #go{padding:24px;font-size:1.35rem}
.pg-game #top5box:not([hidden]){display:block}
.t5{display:grid;grid-template-columns:2.4em 1fr auto;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.t5 span:first-child{color:var(--mut)}.t5 span:last-child{color:var(--a1)}
.t5.me{background:rgba(201,164,92,.12)}
.t5 em{display:block;font-style:normal;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rt,var(--mut))}
.t5.r1{--rt:#ecd08f}.t5.r2{--rt:#d6dce3}.t5.r3{--rt:#e3a874}.t5.r4{--rt:#c4b6f7}
.pg-game #game.on{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;grid-template-rows:auto auto 1fr;gap:16px 28px;min-height:calc(100vh - 72px)}
.pg-game #game .top,.pg-game #game .bar{grid-column:1/-1}
.pg-game #game .panel{display:block;grid-column:1;grid-row:3;align-self:start}
.pg-game #game .qc{grid-column:2;grid-row:3}
.pg-game #game .pad{grid-column:3;grid-row:3;align-self:end}
.pg-game .panel{background:rgba(16,13,9,.74);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:16px}
.pg-game .panel div{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.pg-game .panel b{font-weight:400;font-style:italic;font-size:1.5rem;color:var(--a1);font-variant-numeric:tabular-nums}
.pg-game .panel .keys{color:var(--mut);font-size:.85rem;font-style:italic;line-height:1.5;margin-top:12px}
.pg-game #qt{font-size:clamp(3rem,4.6vw,5rem)}
.pg-game #an{font-size:clamp(3rem,5vw,4.5rem);min-width:50%}
.pg-game .pad button{height:76px;font-size:1.9rem}
.pg-game .bar{height:10px;border-radius:5px}.pg-game .bar i{border-radius:5px}
.pg-game .top b{font-size:2rem}
.pg-game #end.on{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 28px;align-content:start;padding-top:24px}
.pg-game #end>div:first-child{grid-column:1/3;align-self:center}
.pg-game #eg{grid-column:3;grid-row:1}
.pg-game #rv{grid-column:1/-1}
.pg-game #again{margin-top:0}
.pg-game .big{font-size:6.5rem}

/* ---- login ---- */
.pg-login main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:12px 64px;align-content:center;max-width:1100px}
.pg-login .brand{grid-column:1;grid-row:1;align-self:end;flex-direction:column;align-items:flex-start;gap:16px}
.pg-login .brand .logo{width:110px;height:110px}
.pg-login h1{font-size:4rem}
.pg-login .brand .sub{font-size:1.2rem}
.pg-login .pitch{display:block;grid-column:1;grid-row:2;align-self:start;margin:12px 0 0;padding:0;list-style:none;font-size:1.1rem;line-height:1.9}
.pg-login .pitch li::before{content:"◆";color:var(--gold);margin-right:12px;font-size:.7em;vertical-align:.15em}
.pg-login .card{grid-column:2;grid-row:1/span 2;align-self:center;padding:22px}
.pg-login #guest{grid-column:2;grid-row:3}
.pg-login .cap{grid-column:1/-1}

/* ---- ranking: estilos em ranking.html ---- */

}</style>
</head>

<script>
// Mental Math — pontos do ranking geral. É a MESMA conta da função run_points no Supabase
// (supabase/migrations/*_ranking_pontos.sql): se mudar a tabela aqui, mude lá também.
//   pontos = acertos × pontos por acerto × bônus do modo × precisão (acertos ÷ tentativas)
(function(g){
  // Pontos por acerto: operação → [Fácil, Médio, Difícil, Expert]
  const TABLE={'+':[25,65,150,375],'−':[25,70,160,390],'×':[20,65,225,600],'÷':[25,65,225,600],
    '²':[10,55,125,225],'√':[10,45,100,180],'%':[60,110,200,450],'^':[20,65,200,375],'!':[20,55,150,270]};
  // Bônus de nível (×100), de modo (×10) e de decimais (×10): tudo em inteiros, como no banco.
  const TILT=[100,110,125,150],MODE={daily:12,surv:13},DEC=15,BASIC='+−×÷';
  const sum10=(lvl,dec,ops)=>{
    const v=[...ops].filter(o=>TABLE[o]&&TILT[lvl-1]);
    return {n:v.length,s:v.reduce((t,o)=>t+TABLE[o][lvl-1]*(dec&&BASIC.includes(o)?DEC:10),0)};
  };
  // Pontos por acerto: média das operações escolhidas (cada questão sorteia uma delas).
  const perHit=(lvl,dec,ops,mode)=>{const {n,s}=sum10(lvl,dec,ops);return n?s*(MODE[mode]||10)/(100*n):0};
  // score = tempo em ms (30 questões e Desafio do dia) ou acertos (Sprint e Sobrevivência)
  const run=(mode,lvl,dec,ops,score,ok,err)=>{
    const {n,s}=sum10(lvl,dec,ops),tilt=TILT[lvl-1];
    if(!n||ok<=0)return 0;
    // Trava contra valores impossíveis: no máximo 10× mais rápido que o tempo típico.
    const cap=mode==='surv'?150:mode==='sprint'?Math.floor(600*n*tilt/s):Math.floor(Math.max(score,0)*n*tilt/(100*s));
    return Math.round(Math.min(ok,cap)*s*(MODE[mode]||10)*ok/(100*n*(ok+err)));
  };
  g.MMpoints={TABLE,TILT,MODE,DEC,perHit,run};
})(typeof window!=='undefined'?window:globalThis);
</script>

function next(){S.q=gen();S.v='';S.hl=0;S.hq=0;S.hint='';S.q0=performance.now();S.lim=Math.max(800,6000*Math.pow(.96,S.ok));draw()}
function panel(){const a=S.tm.length?S.tm.reduce((x,y)=>x+y)/S.tm.length/1000:0;$('#kok').textContent=S.ok;$('#kerr').textContent=S.err;$('#kst').textContent=S.st;$('#kavg').textContent=a?cm(a.toFixed(2))+'s':'—';$('#khint').textContent=S.hints}
function draw(){
  panel();
  $('#qt').innerHTML=S.q.h||S.q.a+' <span class="o">'+S.q.o+'</span> '+S.q.b;
  $('#an').textContent=S.v.replace(',',L.dec);$('#hint').textContent=S.hint;const hb=$('#hb');hb.textContent=t(S.hl==1?'more_hint':'hint');hb.disabled=S.hl>=2;
  $('#sc').textContent=S.st>1?'🔥 '+S.st:'';
  $('#st').textContent=S.msg||L.n('hits',S.ok)+' · '+L.n('errs',S.err);
}
const fx=c=>{const e=$('#qc');e.classList.remove('ok','bad');void e.offsetWidth;e.classList.add(c)};
const miss=sk=>{
  S.err++;S.st=0;const c=cm(S.q.c),r=S.q.t+' = '+c;
  S.msg=sk?t('skipped',{c}):t('typed',{v:S.v.replace(',',L.dec)||t('nothing'),c});
  if(!S.rv.includes(r))S.rv.push(r);
  if(TM())S.pen+=3000;
  if(cfg.mode==='surv')end(t('end_wrong',{c}));
};
function press(k){
  if(!S||S.over)return;
  if(k==='s'){miss(1);if(!S.over)next();return}
  if(k===','&&(!cfg.dec||S.v.includes(',')))return;
  S.msg='';
  S.v=k==='b'?S.v.slice(0,-1):S.v+k;
  if(/\d/.test(S.v)&&norm(S.v)===S.q.c){
    S.ok++;S.st=S.hq?0:S.st+1;S.ms=Math.max(S.ms,S.st);S.tm.push(performance.now()-S.q0);plim();
    if(TM()&&S.ok>=NQ())return end(t('end_done'));
    next();fx('ok');
  }else if(S.v.length>=S.q.c.length){
    miss();bzz();
    if(!S.over){fx('bad');try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}S.v='';draw()}
  }else draw();
}
function tick(){
  if(S.over)return;
  const n=performance.now(),el=n-S.t0+S.pen;let f,s;
  if(cfg.mode==='sprint'){const l=6e4-el;f=l/6e4;s=Math.ceil(Math.max(l,0)/1000)+'s';if(l<=0)return end(t('end_time'))}
  else if(TM()){f=1-S.ok/NQ();s=cm((el/1000).toFixed(1))+'s'}
  else{const l=S.lim-(n-S.q0);f=l/S.lim;s=cm((Math.max(l,0)/1000).toFixed(1))+'s';if(l<=0){bzz();return end(t('end_timeout'))}}
  $('#stat').textContent=s;$('#bar i').style.width=Math.max(0,f)*100+'%';
  $('#bar').classList.toggle('low',!TM()&&f<.2);
  S.raf=requestAnimationFrame(tick);
}
function end(msg){
  if(S.over)return;S.over=true;cancelAnimationFrame(S.raf);
  const el=performance.now()-S.t0+S.pen,tm=TM(),done=tm&&S.ok>=NQ(),sc=done?Math.round(el):S.ok,k=rk(),p=rec[k];
  const nr=tm?done&&(p==null||sc<p):S.ok>0&&(p==null||sc>p);
  if(nr){rec[k]=sc;save()}
  const tot=S.ok+S.err,avg=S.tm.length?S.tm.reduce((a,b)=>a+b)/S.tm.length/1000:0,valid=tm?done:S.ok>0;
  // Mesma conta do ranking geral (points.js = função run_points do Supabase)
  const pts=valid?MMpoints.run(cfg.mode,cfg.lvl,cfg.dec,cfg.ops.join(''),sc,S.ok,S.err):0;
  $('#et').textContent=msg;
  $('#eb').textContent=done?fmt(sc):S.ok;
  const er=$('#er');er.textContent=t(done?'total_time':'hits_word');er.appendChild(document.createElement('br'));
  if(nr){const b=document.createElement('span');b.className='badge';b.textContent=t('new_rec');er.appendChild(b)}
  else er.append(t('rec',{r:rec[k]==null?t('rec_none'):fmtRec(rec[k])}));
  $('#eg').innerHTML=[['s_pts',num(pts)],['s_ok',S.ok],['s_err',S.err],['s_acc',tot?Math.round(S.ok/tot*100)+'%':'—'],['s_avg',avg?cm(avg.toFixed(2))+'s':'—'],['s_ms',S.ms],['s_h',S.hints]].map(([a,b])=>`<div><b>${b}</b><span>${t(a)}</span></div>`).join('');
  $('#rv').innerHTML=S.rv.length?'<h2>'+t('review')+'</h2>'+S.rv.slice(0,5).map(r=>`<div>${r}</div>`).join(''):'';
  $('#rv').style.display=S.rv.length?'':'none';
  const dt=cfg.mode==='daily'?' '+L.dm(day()):'',u=/^https?:/.test(location.protocol)&&!/^https?:\/\/localhost/.test(location.href)?'\n'+location.href.replace(/[^/]*([?#].*)?$/,''):(window.MM&&MM.site?'\n'+MM.site:'');
  S.share='Mental Math · '+t('m_'+cfg.mode)+dt+' · '+LV[cfg.lvl-1]+' · '+cfg.ops.map(o=>LB[o]||o).join(' ')+(cfg.dec?' · '+t('decimals'):'')+'\n'+(done?'⏱ '+fmt(sc)+' · ':'')+L.n('hits',S.ok)+', '+L.n('errs',S.err)+(nr?t('share_rec'):'')+u;
  $('#share').textContent=t('share');
  if($('#sent'))$('#sent').textContent='';
  const lk=$('.lk');if(lk)lk.href='ranking.html#b='+encodeURIComponent(bk());
  show('end');
  if(window.MMsubmit)window.MMsubmit({mode:cfg.mode,board:bk(),score:sc,ok:S.ok,err:S.err,valid});
}

$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,',',0,'b'].map(k=>`<button data-k="${k}" aria-label="${k=='b'?t('k_del'):k==','?t('k_dec'):k}">${k=='b'?'⌫':k==','?L.dec:k}</button>`).join('');
$('#pad').onpointerdown=e=>{const b=e.target.closest('button');if(b){e.preventDefault();press(b.dataset.k)}};
$('#skip').onclick=()=>press('s');
$('#share').onclick=async()=>{
  if(!S||!S.share)return;const b=$('#share'),cap=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Share;
  try{
    if(cap){await cap.share({text:S.share});return}
    if(navigator.share){await navigator.share({text:S.share});return}
    await navigator.clipboard.writeText(S.share);b.textContent=t('copied');
  }catch(e){if(e.name!=='AbortError'&&!/cancel/i.test(e.message||''))b.textContent=t('share_fail')}
};
$('#hb').onclick=useHint;
$('#go').onclick=$('#again').onclick=start;
$('#back').onclick=$('#quit').onclick=()=>{if(S){S.over=true;cancelAnimationFrame(S.raf)}ui();show('home')};
addEventListener('keydown',e=>{
  if(!$('#game').classList.contains('on')||e.repeat)return;
  if(/^\d$/.test(e.key))press(e.key);
  else if(e.key===','||e.key==='.')press(',');
  else if(e.key==='Backspace')press('b');
  else if(e.key==='h'||e.key==='H'||e.key==='?')useHint();
  else if(e.key==='Enter'||e.key===' ')e.preventDefault();
  else if(e.key==='Escape')$('#quit').click();
});
L.apply();ui();
</script>
</body>
</html>
