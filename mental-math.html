:root{color-scheme:dark;--bg:#0c0a08;--sf:#151109;--s2:#1d1810;--ink:#e6d9b8;--mut:#a09068;--line:#4a3d24;--gold:#c9a45c;--a1:#ecd08f;--a2:#b8893a;--on:#1a1207;--ok:#7ccf6a;--bad:#e5534b;--sp:linear-gradient(90deg,#8b3fd6,#3b6be0,#2fb4e0,#3fbf5f,#f2d13c,#f08a24,#e5322d);--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"DejaVu Serif",serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:#050403;color:var(--ink);font:16px/1.4 var(--serif);display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
main::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,164,92,.45);pointer-events:none;z-index:2;background:radial-gradient(circle at 0 0,var(--gold) 2px,transparent 3px),radial-gradient(circle at 100% 0,var(--gold) 2px,transparent 3px),radial-gradient(circle at 0 100%,var(--gold) 2px,transparent 3px),radial-gradient(circle at 100% 100%,var(--gold) 2px,transparent 3px)}
main{width:100%;max-width:440px;padding:24px 20px;display:flex;flex-direction:column;position:relative;background:linear-gradient(180deg,rgba(8,7,5,var(--o1,.5)),rgba(8,7,5,var(--o2,.8))),var(--wp) center top/cover no-repeat;box-shadow:0 0 0 1px rgba(201,164,92,.2),0 30px 80px rgba(0,0,0,.7)}
main.play{--o1:.8;--o2:.92}
section{display:none;flex:1;flex-direction:column;gap:14px}
section.on{display:flex}
p{margin:0}h1{margin:0;font-size:1.9rem;font-style:italic;font-weight:400;letter-spacing:-.01em}
h2{margin:0 0 10px;font-size:.68rem;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.sub,.rec{color:var(--mut);font-style:italic}.rec{text-align:center}
.g{background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{display:flex;align-items:center;gap:12px;padding:8px 0}
.logo{flex:none;width:56px;height:56px}
.card{background:linear-gradient(180deg,rgba(255,240,200,.05),transparent),rgba(16,13,9,.74);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;color:inherit;background:rgba(29,24,16,.86);border:1px solid var(--line);border-radius:10px;padding:11px;cursor:pointer;touch-action:manipulation;user-select:none;transition:transform .08s}
button:active{transform:scale(.96)}
button:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.chip[aria-pressed=true]{color:var(--on);border-color:transparent;font-weight:700;background:linear-gradient(135deg,var(--a1),var(--a2))}
.op{font-size:1.25rem;padding:8px 0}
#ops{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
sup{font-size:.5em;vertical-align:.9em;color:var(--a1)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-top:12px;text-align:left}
.sw small,.mode small{display:block;color:var(--mut);font-style:italic}
.sw i{flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:.2s}
.sw[aria-checked=true] i{background:linear-gradient(90deg,var(--a1),var(--a2))}
.sw[aria-checked=true] i::after{transform:translateX(18px);background:var(--on)}
.modes{display:grid;gap:8px}
.mode{display:flex;align-items:center;gap:12px;text-align:left}
.bd{flex:none;width:46px;height:46px;border-radius:10px;display:grid;place-items:center;font-style:italic;font-weight:700;background:var(--sf);border:1px solid var(--line)}
.mode[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.mode[aria-pressed=true] .bd{color:var(--on);border-color:transparent;background:linear-gradient(135deg,var(--a1),var(--a2))}
.cta{border:0;color:var(--on);font-weight:700;font-size:1.1rem;letter-spacing:.04em;padding:16px;border-radius:12px;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 28px rgba(201,164,92,.22)}
.ghost{background:transparent}
.wave{width:100%;height:20px;color:var(--line)}
.cap{text-align:center;font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--mut);opacity:.7}
.top{display:flex;align-items:center;gap:10px}
.top b{flex:1;font-size:1.5rem;font-style:italic;font-weight:400;font-variant-numeric:tabular-nums}
.top #sc{color:var(--a1)}
.ic{padding:8px 12px}
.bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:3px;background:var(--sp)}
.bar.low i{background:var(--bad)}
.qc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:radial-gradient(70% 55% at 50% 40%,rgba(160,120,60,.16),transparent),rgba(14,11,8,.78);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:16px}
#qt{font-size:clamp(2.6rem,14vw,4rem);font-style:italic;font-weight:400;color:#f0e4c4;text-shadow:0 0 26px rgba(232,201,135,.25);font-variant-numeric:tabular-nums}
.o{color:var(--a1)}
#an{font-size:clamp(2rem,10vw,3rem);font-style:italic;min-width:60%;min-height:1.3em;color:var(--a1);border-bottom:1px solid var(--gold);font-variant-numeric:tabular-nums}
#an::after{content:"";display:inline-block;width:2px;height:.9em;margin-left:3px;vertical-align:-.08em;background:var(--a1);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#st{min-height:1.4em;color:var(--mut);font-size:.95rem;font-style:italic}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad button{height:60px;font-size:1.6rem;background:rgba(18,14,10,.88);border-radius:12px;box-shadow:0 3px 0 #070504;font-variant-numeric:tabular-nums}
.pad button:active{box-shadow:none;transform:translateY(3px)}
.pad [data-k=b],.pad [data-k=","]{background:var(--s2);color:var(--a1)}
.pad .off{opacity:.3}
.qc.ok{animation:ok .35s}.qc.bad{animation:bad .35s}
@keyframes ok{40%{box-shadow:0 0 0 2px var(--ok),0 0 34px rgba(255,236,190,.35)}}
@keyframes bad{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}30%{box-shadow:0 0 0 2px var(--bad)}}
@media(prefers-reduced-motion:reduce){.qc.ok,.qc.bad,#an::after{animation:none}}
.res{text-align:center}
.big{font-size:4.4rem;font-style:italic;font-weight:400;line-height:1.1;font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:8px;padding:4px 14px;border-radius:99px;font-weight:700;color:var(--on);background:linear-gradient(135deg,var(--a1),var(--a2))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:rgba(16,13,9,.74);border:1px solid var(--line);border-radius:10px;padding:12px}
.stats div:last-child:nth-child(odd){grid-column:1/-1}
.stats b{display:block;font-size:1.6rem;font-style:italic;font-weight:400;color:var(--a1);font-variant-numeric:tabular-nums}
.stats span{color:var(--mut);font-size:.85rem}
#rv{text-align:left}#rv div{padding:6px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
#again{margin-top:auto}
.side{display:contents}
.panel{display:none}
#top5box{display:none}
button:disabled{opacity:.35;cursor:default}
#hint{max-width:100%;padding:8px 12px;text-align:left;font-style:italic;font-size:.95rem;color:var(--ink);background:rgba(201,164,92,.08);border-left:2px solid var(--gold);border-radius:0 8px 8px 0}
#hint:empty{display:none}
</style>

main{max-width:1240px;margin:0 auto;padding:36px 56px;background:none;box-shadow:none;min-height:100vh}
main::before{position:fixed;inset:14px}
.brand,.who,.rec,.cap,.top h1{text-shadow:0 1px 10px rgba(0,0,0,.85)}
@media (hover:hover){button:hover:not(:disabled),.btn:hover,.lk:hover,.who a:hover{border-color:var(--gold)}}
@media (min-width:1600px){main{max-width:1440px}.pg-game #qt{font-size:6rem}}

/* ---- jogo ---- */
.pg-game .brand .logo{width:72px;height:72px}
.pg-game h1{font-size:2.6rem}
.pg-game #home.on{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:18px 36px;align-content:start}
.pg-game #home .brand{grid-column:1;grid-row:1}
.pg-game #home .who{grid-column:2;grid-row:1;justify-self:end;align-self:center}
.pg-game #home>.card{grid-column:1}
.pg-game #home .side{grid-column:2;grid-row:2/span 3;display:flex;flex-direction:column;gap:16px}
.pg-game .rec{text-align:left;font-size:1.05rem}
.pg-game #go{padding:24px;font-size:1.35rem}
.pg-game #top5box:not([hidden]){display:block}
.t5{display:grid;grid-template-columns:2.4em 1fr auto;gap:8px;padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.t5 span:first-child{color:var(--mut)}.t5 span:last-child{color:var(--a1)}
.t5.me{background:rgba(201,164,92,.12)}
.pg-game #game.on{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;grid-template-rows:auto auto 1fr;gap:16px 28px;min-height:calc(100vh - 72px)}
.pg-game #game .top,.pg-game #game .bar{grid-column:1/-1}
.pg-game #game .panel{display:block;grid-column:1;grid-row:3;align-self:start}
.pg-game #game .qc{grid-column:2;grid-row:3}
.pg-game #game .pad{grid-column:3;grid-row:3;align-self:end}
.pg-game .panel{background:rgba(16,13,9,.74);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:14px;padding:16px}
.pg-game .panel div{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line)}
.pg-game .panel b{font-weight:400;font-style:italic;font-size:1.5rem;color:var(--a1);font-variant-numeric:tabular-nums}
.pg-game .panel .keys{color:var(--mut);font-size:.85rem;font-style:italic;line-height:1.5;margin-top:12px}
.pg-game #qt{font-size:clamp(3rem,4.6vw,5rem)}
.pg-game #an{font-size:clamp(3rem,5vw,4.5rem);min-width:50%}
.pg-game .pad button{height:76px;font-size:1.9rem}
.pg-game .bar{height:10px;border-radius:5px}.pg-game .bar i{border-radius:5px}
.pg-game .top b{font-size:2rem}
.pg-game #end.on{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 28px;align-content:start;padding-top:24px}
.pg-game #end>div:first-child{grid-column:1/3;align-self:center}
.pg-game #eg{grid-column:3;grid-row:1}
.pg-game #rv{grid-column:1/-1}
.pg-game #again{margin-top:0}
.pg-game .big{font-size:6.5rem}

/* ---- login ---- */
.pg-login main{display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:12px 64px;align-content:center;max-width:1100px}
.pg-login .brand{grid-column:1;grid-row:1;align-self:end;flex-direction:column;align-items:flex-start;gap:16px}
.pg-login .brand .logo{width:110px;height:110px}
.pg-login h1{font-size:4rem}
.pg-login .brand .sub{font-size:1.2rem}
.pg-login .pitch{display:block;grid-column:1;grid-row:2;align-self:start;margin:12px 0 0;padding:0;list-style:none;font-size:1.1rem;line-height:1.9}
.pg-login .pitch li::before{content:"◆";color:var(--gold);margin-right:12px;font-size:.7em;vertical-align:.15em}
.pg-login .card{grid-column:2;grid-row:1/span 2;align-self:center;padding:22px}
.pg-login #guest{grid-column:2;grid-row:3}
.pg-login .cap{grid-column:1/-1}

/* ---- ranking ---- */
.pg-rank main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px 32px;align-content:start;max-width:1040px}
.pg-rank .top{grid-column:1/-1}
.pg-rank #pd{grid-column:1;flex-direction:column}
.pg-rank #bd{grid-column:1}
.pg-rank .card{grid-column:2;grid-row:2/span 3;align-self:start}
.pg-rank .cap{grid-column:1/-1}
.pg-rank td{padding:14px 10px;font-size:1.1rem}

}</style>
</head>
<body class="pg-game">
<main>
<section id="home" class="on">
<header class="brand"><svg class="logo" viewBox="0 0 56 56" aria-hidden="true"><path d="M28 8 48 44H8Z" fill="rgba(236,208,143,.08)" stroke="#ecd08f" stroke-width="1.5" stroke-linejoin="round"/><path d="M0 38 15.5 31H41" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/><g stroke-width="1.6" stroke-linecap="round"><path d="M41 31 56 36" stroke="#ef4444"/><path d="M41 31 56 39.5" stroke="#f59e0b"/><path d="M41 31 56 43" stroke="#eab308"/><path d="M41 31 56 46.5" stroke="#22c55e"/><path d="M41 31 56 50" stroke="#3b82f6"/><path d="M41 31 56 53.5" stroke="#8b5cf6"/></g></svg><div><h1 class="g">Mental Math</h1><p class="sub">Acertou, avança sozinho.</p></div></header>
<div class="card"><h2>Operações</h2><div class="row" id="ops"></div>
<button class="sw" id="dec" data-d="1" role="switch" aria-checked="false"><span>Números decimais<small>1 casa decimal, resposta com vírgula</small></span><i></i></button>
<button class="sw" id="snd" data-s="1" role="switch" aria-checked="true"><span>Sons<small>“Plim” ao acertar, som grave ao errar</small></span><i></i></button></div>
<div class="card"><h2>Nível</h2><div class="row" id="lv"></div></div>
<div class="card"><h2>Modo</h2><div class="modes" id="md"></div></div>
<div class="side">
<p class="rec" id="rec"></p>
<button class="cta" id="go">Começar</button>
<svg class="wave" viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10C25 0 50 0 75 10S125 20 150 10 200 0 225 10 275 20 300 10 350 0 375 10 400 10" fill="none" stroke="currentColor"/></svg><p class="cap">Principia Mathematica</p>
</div>
</section>
<section id="game">
<div class="top"><button class="ic" id="quit" aria-label="Sair do treino">✕</button><b id="stat"></b><span id="sc"></span><button class="ic" id="hb">Dica</button><button class="ic" id="skip">Pular</button></div>
<div class="bar" id="bar"><i></i></div>
<aside class="panel" id="panel"><h2>Painel</h2>
<div><span>Acertos</span><b id="kok">0</b></div>
<div><span>Erros</span><b id="kerr">0</b></div>
<div><span>Sequência</span><b id="kst">0</b></div>
<div><span>Tempo médio</span><b id="kavg">—</b></div>
<div><span>Dicas</span><b id="khint">0</b></div>
<p class="keys">Digite com o teclado: números, vírgula e ⌫ para apagar.<br>H pede dica · Esc sai do treino.</p></aside>
<div class="qc" id="qc"><div id="qt"></div><div id="an"></div><div id="st" aria-live="polite"></div><div id="hint" aria-live="polite"></div></div>
<div class="pad" id="pad"></div>
</section>
<section id="end" class="res">
<div><p class="sub" id="et"></p><div class="big g" id="eb"></div><p id="er"></p></div>
<div class="stats" id="eg"></div>
<div class="card" id="rv"></div>
<button class="cta" id="again">Jogar de novo</button>
<button class="ghost" id="back">Voltar ao início</button>
</section>
</main>
<script>
let rnd=Math.random;
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const OPS=['+','−','×','÷','!','²','√','%','^'],LB={'!':'n!','²':'x²','^':'xⁿ'},AL={'!':'fatorial','²':'quadrado','√':'raiz quadrada','%':'porcentagem','^':'potência'},XC={'!':'f','²':'q','√':'r','%':'p','^':'x'},LV=['Fácil','Médio','Difícil','Expert'],
MODES={sprint:['60″','Sprint de 60 segundos','Máximo de acertos'],n30:['30','30 questões','Menor tempo; cada erro soma 3s'],daily:['20','Desafio do dia','20 questões iguais para todos hoje; menor tempo'],surv:['∞','Sobrevivência','O tempo encolhe; um erro encerra']},
AS=[[2,20],[10,99],[100,999],[1000,9999]],
MU=[[[2,9],[2,9]],[[11,99],[2,9]],[[11,29],[11,29]],[[11,99],[11,99]]],
FN=[[4,6],[5,7],[6,9],[7,10]];
let cfg={ops:['+','−'],lvl:2,mode:'sprint',dec:false,snd:true},rec={},S;
try{const d=JSON.parse(localStorage.getItem('calcmental')||'{}');Object.assign(cfg,d.cfg);rec=d.rec||{}}catch(e){}
if(!Array.isArray(cfg.ops)||!cfg.ops.length)cfg.ops=['+'];
if(!MODES[cfg.mode])cfg.mode='sprint';
cfg.lvl=Math.min(4,Math.max(1,+cfg.lvl||2));cfg.dec=!!cfg.dec;cfg.snd=cfg.snd!==false;
const save=()=>{try{localStorage.setItem('calcmental',JSON.stringify({cfg,rec}))}catch(e){}};
const day=()=>{try{return new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'})}catch(e){return new Date().toISOString().slice(0,10)}},rk=()=>(cfg.mode==='daily'?'daily'+day():cfg.mode)+cfg.lvl+(cfg.dec?'d':'')+cfg.ops.map(o=>XC[o]||'').join(''),cm=x=>String(x).replace('.',','),
fmt=r=>TM()?cm((r/1000).toFixed(1))+'s':r,
F=n=>{const i=Math.floor(n/10),f=n%10;return f?i+'.'+f:String(i)},
show=id=>{document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id===id));$('main').classList.toggle('play',id==='game');document.body.classList.toggle('play',id==='game')},
norm=v=>{let x=v.replace(',','.');if(x[0]==='.')x='0'+x;return x.includes('.')?x.replace(/0+$/,'').replace(/\.$/,''):x};

const TM=()=>cfg.mode==='n30'||cfg.mode==='daily',NQ=()=>cfg.mode==='daily'?20:30,
mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296},
hash=s=>{let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0};
let AC;
function audio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function plim(){
  if(!cfg.snd||!AC)return;
  try{
    const t=AC.currentTime,n=(f,g,d,w)=>{const x=AC.createOscillator(),v=AC.createGain();x.type='sine';x.frequency.value=f;v.gain.setValueAtTime(0,t+w);v.gain.linearRampToValueAtTime(g,t+w+.005);v.gain.exponentialRampToValueAtTime(.0001,t+w+d);x.connect(v);v.connect(AC.destination);x.start(t+w);x.stop(t+w+d+.03)};
    n(1318.5,.14,.35,0);n(1975.5,.12,.5,.07);n(3951,.04,.25,.07);
  }catch(e){}
}
function bzz(){
  if(!cfg.snd||!AC)return;
  try{const t=AC.currentTime,x=AC.createOscillator(),v=AC.createGain();x.type='sawtooth';x.frequency.setValueAtTime(190,t);x.frequency.exponentialRampToValueAtTime(95,t+.28);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(.1,t+.01);v.gain.exponentialRampToValueAtTime(.0001,t+.3);x.connect(v);v.connect(AC.destination);x.start(t);x.stop(t+.32)}catch(e){}
}
const L=n=>{const p=Math.pow(10,String(n).length-1);return Math.floor(n/p)*p};
function hint(q,l){
  const {A,B,C,o}=q,x=q.dec?' (sem vírgula)':'';
  if(o==='²'){const n=q.n,d=Math.abs(n-10*Math.round(n/10));
    if(!d)return l==1?`Termina em zero: calcule ${n/10}² e acrescente dois zeros.`:`Comece por ${n/10} × ${n/10}.`;
    return l==1?`Use (n − d)(n + d) + d², com d a distância até a dezena mais próxima (aqui d = ${d}).`:(n-d>0?`${n-d} × ${n+d} = ${(n-d)*(n+d)}. Falta somar ${d*d}.`:`Use a tabuada do ${n}.`)}
  if(o==='√'){const n=q.n,N=n*n,t=10*Math.floor(n/10),E={1:'1 ou 9',4:'2 ou 8',6:'4 ou 6',9:'3 ou 7'}[N%10];
    return l==1?'Procure o número que, multiplicado por ele mesmo, dá o valor. Comece pelo último dígito.':`Está entre ${t} (pois ${t}² = ${t*t}) e ${t+10} (pois ${t+10}² = ${(t+10)**2}).`+(E?` A raiz termina em ${E}.`:'')}
  if(o==='^'){const b=q.n,e=q.x;return l==1?'Multiplique a base por ela mesma, o número de vezes do expoente.':(e==2?`É um quadrado: ${b} × ${b}. Use (n − d)(n + d) + d².`:`${b} × ${b} = ${b*b}. Depois multiplique por ${b} mais ${e-2} vez${e-2>1?'es':''}.`)}
  if(o==='%'){const p=q.p,b=q.bs;
    if(p===10)return l==1?'10% é a décima parte: divida por 10.':'Basta andar a vírgula uma casa para a esquerda.';
    if(p===50)return l==1?'50% é a metade.':'Divida por 2.';
    if(p===25)return l==1?'25% é um quarto: a metade da metade.':`Metade de ${b} = ${b/2}. Agora tire a metade de novo.`;
    return l==1?'Monte com pedaços fáceis: 10% (dividir por 10), 5% (metade de 10%) e 1% (dividir por 100).':`10% de ${b} = ${cm(b/10)}. Combine 10%, 5% e 1% para chegar a ${p}%.`}
  if(o==='!'){const n=q.n,m=q.m;
    if(m)return l==1?'Cancele os fatores em comum: só sobram os números de cima que não aparecem embaixo.':`Sobram: ${n} × ${n-1}${n-m>2?' × '+(n-2):''}`;
    return l==1?`Multiplique todos os inteiros de ${n} até 1, guardando o resultado parcial.`:`${n} × ${n-1} = ${n*(n-1)}. Agora multiplique por ${n-2}${n>4?', depois por '+(n-3)+' e assim por diante':''}.`}
  if(l==1)return {'+':'Some por partes: primeiro o maior pedaço do segundo número, depois o resto.','−':'Subtraia por partes: tire primeiro o maior pedaço do segundo número, depois o resto.','×':'Decomponha o primeiro número em partes redondas e multiplique cada parte.','÷':'Pense ao contrário: qual número vezes o divisor dá o dividendo?'}[o]+(q.dec?' Com decimais, ignore a vírgula e recoloque no fim (1 casa).':'');
  if(o==='+'||o==='−'){const p=L(B),r=B-p;return r?`${A} ${o} ${p} = ${o==='+'?A+p:A-p}. Falta ${o==='+'?'somar':'tirar'} ${r}.${x}`:`Faça em uma etapa: ${o==='+'?'some':'tire'} ${B} completando até a próxima dezena.${x}`}
  if(o==='×'){const p=L(A),r=A-p;return r?`${p} × ${B} = ${p*B}. Falta ${r} × ${B}.${x}`:`Conta direta da tabuada: lembre de ${B} × ${A}.${x}`}
  const p=L(C);return p===C?`Use a tabuada do ${B}: qual resultado chega mais perto de ${A}?${x}`:`${p} × ${B} = ${p*B}. Quanto falta para chegar a ${A}?${x}`;
}
function useHint(){
  if(!S||S.over||S.hl>=2)return;
  S.hl++;S.hints++;S.hq=1;if(TM())S.pen+=2000;
  S.hint=hint(S.q,S.hl)+(TM()?' (+2s)':'');draw();
}
const SQ=[[2,12],[11,25],[21,50],[51,99]],PW=[[[2,5],[2,3]],[[2,9],[2,4]],[[2,9],[3,5]],[[3,12],[3,6]]],PC=[[10,20,25,50],[5,15,30,40,60,75],[12,15,35,45,65,80,90]],PB=[[20,200],[40,400],[100,1000],[100,2000]],
gcd=(a,b)=>b?gcd(b,a%b):a;
function gen2(o,l){
  const v='<span class="o">',e='</span>';let n,h,t,c,x,p,b;
  if(o==='²'){n=R(...SQ[l]);t=n+'²';h=n+v+'²'+e;c=n*n}
  else if(o==='√'){n=R(...SQ[l]);t='√'+n*n;h=v+'√'+e+n*n;c=n}
  else if(o==='^'){n=R(...PW[l][0]);x=R(...PW[l][1]);t=n+'^'+x;h=n+'<sup>'+x+'</sup>';c=Math.pow(n,x)}
  else{p=l<3?PC[l][R(0,PC[l].length-1)]:R(1,99);const st=100/gcd(p,100);b=st*R(Math.ceil(PB[l][0]/st),Math.floor(PB[l][1]/st));t=p+'% de '+b;h=p+v+'%'+e+' de '+b;c=p*b/100}
  return{a:t,o,b:'',A:0,B:0,C:0,n,x,p,bs:b,h,t,dec:false,c:String(c)};
}
function gen(){
  const o=cfg.ops[R(0,cfg.ops.length-1)],l=cfg.lvl-1,k=cfg.dec?10:1,D=(n,s)=>s&&cfg.dec?(n/10).toFixed(1).replace('.',','):String(n);
  if(o==='!'){
    const [lo,hi]=FN[l],f=n=>{let r=1;for(let i=2;i<=n;i++)r*=i;return r},v='<span class="o">!</span>';
    const n=R(lo,hi);let m,t,h,c;
    if(l>1&&R(0,1)){m=n-R(2,3);c=f(n)/f(m);t=n+'! ÷ '+m+'!';h=n+v+' ÷ '+m+v}
    else{c=f(n);t=n+'!';h=n+v}
    return{a:t,o,b:'',A:0,B:0,C:0,n,m,h,t,dec:false,c:String(c)};
  }
  if('²√%^'.includes(o))return gen2(o,l);
  let A,B,C,sb=1;
  if(o==='+'||o==='−'){A=R(AS[l][0]*k,AS[l][1]*k);B=R(AS[l][0]*k,AS[l][1]*k);if(o==='−'&&B>A)[A,B]=[B,A];C=o==='+'?A+B:A-B}
  else{const [x,y]=MU[l],q=R(x[0]*k,x[1]*k),m=R(...y);sb=0;if(o==='×'){A=q;B=m;C=q*m}else{C=q;B=m;A=q*m}}
  const a=D(A,1),b=D(B,sb);
  return{a,o,b,A,B,C,dec:cfg.dec,t:a+' '+o+' '+b,c:cfg.dec?F(C):String(C)};
}
function ui(){
  $('#ops').innerHTML=OPS.map(o=>`<button class="chip op" data-o="${o}" aria-pressed="${cfg.ops.includes(o)}" aria-label="Operação ${AL[o]||o}">${LB[o]||o}</button>`).join('');
  $('#lv').innerHTML=LV.map((n,i)=>`<button class="chip" data-l="${i+1}" aria-pressed="${cfg.lvl==i+1}">${n}</button>`).join('');
  $('#md').innerHTML=Object.entries(MODES).map(([k,[g,n,d]])=>`<button class="mode" data-m="${k}" aria-pressed="${cfg.mode==k}"><span class="bd">${g}</span><span><b>${n}</b><small>${d}</small></span></button>`).join('');
  $('#dec').setAttribute('aria-checked',cfg.dec);$('#snd').setAttribute('aria-checked',cfg.snd);
  const r=rec[rk()];
  $('#rec').textContent=r==null?'Sem recorde neste modo e nível.':'Recorde: '+fmt(r)+(TM()?'':' acertos');
  if(window.MMtop5)window.MMtop5();
}
$('#home').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.o){const s=new Set(cfg.ops);s.has(d.o)?(s.size>1&&s.delete(d.o)):s.add(d.o);cfg.ops=OPS.filter(x=>s.has(x))}
  else if(d.l)cfg.lvl=+d.l;else if(d.m)cfg.mode=d.m;else if(d.d)cfg.dec=!cfg.dec;else if(d.s){cfg.snd=!cfg.snd;if(cfg.snd){audio();plim()}}else return;
  save();ui();
};

function start(){
  audio();
  rnd=cfg.mode==='daily'?mulberry(hash(day()+'|'+cfg.ops.join('')+cfg.lvl+cfg.dec)):Math.random;
  S={ok:0,err:0,st:0,ms:0,tm:[],pen:0,rv:[],msg:'',hints:0,hl:0,hq:0,hint:'',t0:performance.now(),over:false};
  $('#pad [data-k=","]').classList.toggle('off',!cfg.dec);$('#bar').classList.remove('low');
  show('game');next();tick();
}
function next(){S.q=gen();S.v='';S.hl=0;S.hq=0;S.hint='';S.q0=performance.now();S.lim=Math.max(800,6000*Math.pow(.96,S.ok));draw()}
function panel(){const a=S.tm.length?S.tm.reduce((x,y)=>x+y)/S.tm.length/1000:0;$('#kok').textContent=S.ok;$('#kerr').textContent=S.err;$('#kst').textContent=S.st;$('#kavg').textContent=a?cm(a.toFixed(2))+'s':'—';$('#khint').textContent=S.hints}
function draw(){
  panel();
  $('#qt').innerHTML=S.q.h||S.q.a+' <span class="o">'+S.q.o+'</span> '+S.q.b;
  $('#an').textContent=S.v;$('#hint').textContent=S.hint;const hb=$('#hb');hb.textContent=S.hl==1?'Mais dica':'Dica';hb.disabled=S.hl>=2;
  $('#sc').textContent=S.st>1?'🔥 '+S.st:'';
  $('#st').textContent=S.msg||S.ok+(S.ok==1?' acerto · ':' acertos · ')+S.err+(S.err==1?' erro':' erros');
}
const fx=c=>{const e=$('#qc');e.classList.remove('ok','bad');void e.offsetWidth;e.classList.add(c)};
const miss=sk=>{
  S.err++;S.st=0;const c=cm(S.q.c),r=S.q.t+' = '+c;
  S.msg=(sk?'Pulou':'Digitou '+(S.v||'nada'))+' · era '+c;
  if(!S.rv.includes(r))S.rv.push(r);
  if(TM())S.pen+=3000;
  if(cfg.mode==='surv')end('Errou · era '+c);
};
function press(k){
  if(!S||S.over)return;
  if(k==='s'){miss(1);if(!S.over)next();return}
  if(k===','&&(!cfg.dec||S.v.includes(',')))return;
  S.msg='';
  S.v=k==='b'?S.v.slice(0,-1):S.v+k;
  if(/\d/.test(S.v)&&norm(S.v)===S.q.c){
    S.ok++;S.st=S.hq?0:S.st+1;S.ms=Math.max(S.ms,S.st);S.tm.push(performance.now()-S.q0);plim();
    if(TM()&&S.ok>=NQ())return end('Concluído!');
    next();fx('ok');
  }else if(S.v.length>=S.q.c.length){
    miss();bzz();
    if(!S.over){fx('bad');try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}S.v='';draw()}
  }else draw();
}
function tick(){
  if(S.over)return;
  const n=performance.now(),el=n-S.t0+S.pen;let f,t;
  if(cfg.mode==='sprint'){const l=6e4-el;f=l/6e4;t=Math.ceil(Math.max(l,0)/1000)+'s';if(l<=0)return end('Tempo!')}
  else if(TM()){f=1-S.ok/NQ();t=cm((el/1000).toFixed(1))+'s'}
  else{const l=S.lim-(n-S.q0);f=l/S.lim;t=cm((Math.max(l,0)/1000).toFixed(1))+'s';if(l<=0){bzz();return end('Tempo esgotado!')}}
  $('#stat').textContent=t;$('#bar i').style.width=Math.max(0,f)*100+'%';
  $('#bar').classList.toggle('low',!TM()&&f<.2);
  S.raf=requestAnimationFrame(tick);
}
function end(msg){
  if(S.over)return;S.over=true;cancelAnimationFrame(S.raf);
  const el=performance.now()-S.t0+S.pen,t=TM(),done=t&&S.ok>=NQ(),sc=done?Math.round(el):S.ok,k=rk(),p=rec[k];
  const nr=t?done&&(p==null||sc<p):S.ok>0&&(p==null||sc>p);
  if(nr){rec[k]=sc;save()}
  const tot=S.ok+S.err,avg=S.tm.length?S.tm.reduce((a,b)=>a+b)/S.tm.length/1000:0;
  $('#et').textContent=msg;
  $('#eb').textContent=done?fmt(sc):S.ok;
  $('#er').innerHTML=(done?'tempo total':'acertos')+'<br>'+(nr?'<span class="badge">Novo recorde</span>':'Recorde: '+(rec[k]==null?'sem registro':fmt(rec[k])+(t?'':' acertos')));
  $('#eg').innerHTML=[['Acertos',S.ok],['Erros',S.err],['Precisão',tot?Math.round(S.ok/tot*100)+'%':'—'],['Tempo médio por acerto',avg?cm(avg.toFixed(2))+'s':'—'],['Maior sequência',S.ms],['Dicas usadas',S.hints]].map(([a,b])=>`<div><b>${b}</b><span>${a}</span></div>`).join('');
  $('#rv').innerHTML=S.rv.length?'<h2>Para revisar</h2>'+S.rv.slice(0,5).map(r=>`<div>${r}</div>`).join(''):'';
  $('#rv').style.display=S.rv.length?'':'none';
  show('end');
}

$('#pad').innerHTML=[1,2,3,4,5,6,7,8,9,',',0,'b'].map(k=>`<button data-k="${k}" aria-label="${k=='b'?'Apagar':k==','?'Vírgula':k}">${k=='b'?'⌫':k}</button>`).join('');
$('#pad').onpointerdown=e=>{const b=e.target.closest('button');if(b){e.preventDefault();press(b.dataset.k)}};
$('#skip').onclick=()=>press('s');$('#hb').onclick=useHint;
$('#go').onclick=$('#again').onclick=start;
$('#back').onclick=$('#quit').onclick=()=>{if(S){S.over=true;cancelAnimationFrame(S.raf)}ui();show('home')};
addEventListener('keydown',e=>{
  if(!$('#game').classList.contains('on')||e.repeat)return;
  if(/^\d$/.test(e.key))press(e.key);
  else if(e.key===','||e.key==='.')press(',');
  else if(e.key==='Backspace')press('b');
  else if(e.key==='h'||e.key==='H'||e.key==='?')useHint();
  else if(e.key==='Enter'||e.key===' ')e.preventDefault();
  else if(e.key==='Escape')$('#quit').click();
});
ui();
</script>
