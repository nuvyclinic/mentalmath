# Gera o APK do Mental Math (app Android via Capacitor).
# - A cada push: APK de teste em "Actions → execução → Artifacts".
# - Ao criar uma tag v* (ex.: v1.0.0): publica o APK em "Releases" para qualquer um baixar.
# - Se os segredos ANDROID_KEYSTORE_* existirem: também gera APK e AAB assinados (o AAB é o que vai para a Play Store).
name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths-ignore: ['README.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm ci

      - name: Conferir se mental-math.html está atualizado
        run: npm run check

      - name: Montar a pasta www/
        run: npm run build

      - name: Criar o projeto Android, ícones e versão
        run: |
          npx cap add android
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0c0a08' --iconBackgroundColorDark '#0c0a08' \
            --splashBackgroundColor '#0c0a08' --splashBackgroundColorDark '#0c0a08'
          VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle
          npx cap sync android

      - name: Gerar APK de teste (debug)
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../mental-math-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mental-math-debug-apk
          path: mental-math-debug.apk

      - name: Gerar APK e AAB assinados (release)
        if: env.KEYSTORE_B64 != ''
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          (cd android && ./gradlew assembleRelease bundleRelease --no-daemon)
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --key-pass env:KEY_PASS \
            --out mental-math.apk "$RUNNER_TEMP/aligned.apk"
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -signedjar mental-math.aab android/app/build/outputs/bundle/release/app-release.aab "$KS_ALIAS"
          rm "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_B64 != ''
        with:
          name: mental-math-release
          path: |
            mental-math.apk
            mental-math.aab

      - name: Publicar em Releases (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mental-math-debug.apk
            mental-math.apk
          fail_on_unmatched_files: false
