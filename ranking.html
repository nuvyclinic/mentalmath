<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Mental Math: treine cálculo mental contra o relógio, faça o Desafio do dia e dispute o ranking.">
<title data-i18n="t_rank">Mental Math — Ranking</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="pc.css" media="(min-width: 1200px)">
</head>
<body class="pg-rank">
<main>
<div class="top"><a class="btn" href="jogo.html" data-i18n="play_back"></a><h1 class="g" data-i18n="ranking"></h1></div>
<div class="tabs" id="pd"><button data-p="day" aria-pressed="false" data-i18n="p_day"></button><button data-p="week" aria-pressed="false" data-i18n="p_week"></button><button data-p="all" aria-pressed="true" data-i18n="p_all"></button></div>
<select id="bd" data-i18n-aria="pick_board"></select>
<div class="card"><table><tbody id="rows"></tbody></table><p class="sub" id="empty" data-i18n="loading"></p></div>
<select class="lang"></select>
<p class="cap">Principia Mathematica</p>
</main>
<script src="i18n.js"></script>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="mm.js"></script>
<script>
L.apply();
const t=L.t,$=s=>document.querySelector(s);
const MODES={sprint:t('r_sprint'),n30:t('m_n30'),daily:t('m_daily'),surv:t('m_surv')},LV=[1,2,3,4].map(i=>t('lv'+i)),NM={'!':'n!','²':'x²','^':'xⁿ'};
const day=()=>{try{return new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'})}catch(e){return new Date().toISOString().slice(0,10)}};
const bk=c=>c.mode+'|'+(c.mode==='daily'?day()+'|':'')+c.lvl+'|'+(c.dec?1:0)+'|'+c.ops.join('');
const label=b=>{const p=b.split('|'),m=p[0],d=m==='daily'?p[1]:'',r=p.slice(m==='daily'?2:1);return (MODES[m]||m)+(d?' '+L.dm(d):'')+' · '+(LV[r[0]-1]||'')+' · '+[...(r[2]||'')].map(o=>NM[o]||o).join(' ')+(r[1]==='1'?' · '+t('decimals'):'')};
const fmt=(b,s)=>{const m=b.split('|')[0];return m==='n30'||m==='daily'?(s/1000).toFixed(1).replace('.',L.dec)+'s':L.n('hits',s)};
let sb,period='all',me=null,cur='';
async function init(){
  try{if(!window.MMclient)throw new Error(t('e_mm'));sb=MMclient()}catch(e){$('#empty').textContent=e.message;return}
  const {data:{session}}=await sb.auth.getSession();
  if(session){const {data}=await sb.from('profiles').select('nickname').eq('id',session.user.id).maybeSingle();me=data&&data.nickname}
  try{cur=bk(JSON.parse(localStorage.getItem('calcmental')).cfg)}catch(e){}
  const {data:bl}=await sb.rpc('board_list');
  const boards=(bl||[]).map(x=>x.board);
  if(cur&&!boards.includes(cur))boards.unshift(cur);
  if(!cur&&boards.length)cur=boards[0];
  const s=$('#bd');s.innerHTML='';
  boards.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=label(b);s.appendChild(o)});
  if(cur)s.value=cur;
  load();
}
async function load(){
  const t=$('#rows');t.innerHTML='';
  if(!cur){$('#empty').textContent=t('nobody');return}
  const {data,error}=await sb.rpc('leaderboard',{p_board:cur,p_period:period});
  if(error){$('#empty').textContent=t(navigator.onLine?'rank_fail':'rank_offline');return}
  $('#empty').textContent=data.length?'':t('nobody_period');
  data.forEach(r=>{
    const tr=document.createElement('tr');if(r.nickname===me)tr.className='me';
    [(['🥇','🥈','🥉'][r.pos-1]||'#'+r.pos),r.nickname,fmt(cur,r.score)].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});
    t.appendChild(tr);
  });
}
$('#pd').onclick=e=>{const b=e.target.closest('button');if(!b)return;period=b.dataset.p;[...$('#pd').children].forEach(x=>x.setAttribute('aria-pressed',x===b));load()};
$('#bd').onchange=e=>{cur=e.target.value;load()};
init();
</script>
</body>
</html>
