<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a08">
<!--online-->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="description" content="Mental Math: treine cálculo mental contra o relógio, faça o Desafio do dia e dispute o ranking.">
<!--/online-->
<title>Mental Math</title>
<!-- O visual e a lógica do jogo ficam em game.css e game.js; mental-math.html é gerado a partir deles (npm run build). -->
<link rel="stylesheet" href="game.css">
<link rel="stylesheet" href="pc.css" media="(min-width: 1200px)">
</head>
<body class="pg-game">
<main>
<section id="home" class="on">
<header class="brand"><svg class="logo" viewBox="0 0 56 56" aria-hidden="true"><path d="M28 8 48 44H8Z" fill="rgba(236,208,143,.08)" stroke="#ecd08f" stroke-width="1.5" stroke-linejoin="round"/><path d="M0 38 15.5 31H41" stroke="#fff" stroke-width="1.6" stroke-linecap="round" fill="none"/><g stroke-width="1.6" stroke-linecap="round"><path d="M41 31 56 36" stroke="#ef4444"/><path d="M41 31 56 39.5" stroke="#f59e0b"/><path d="M41 31 56 43" stroke="#eab308"/><path d="M41 31 56 46.5" stroke="#22c55e"/><path d="M41 31 56 50" stroke="#3b82f6"/><path d="M41 31 56 53.5" stroke="#8b5cf6"/></g></svg><div><h1 class="g">Mental Math</h1><p class="sub" data-i18n="sub_game"></p></div></header>
<!--online--><div class="who" id="who" hidden><span id="nick"></span><a href="ranking.html" data-i18n="ranking"></a><button id="out"></button></div><!--/online-->
<div class="card"><h2 data-i18n="h_ops"></h2><div class="row" id="ops"></div>
<button class="sw" id="dec" data-d="1" role="switch" aria-checked="false"><span><span data-i18n="dec"></span><small data-i18n="dec_d"></small></span><i></i></button>
<button class="sw" id="snd" data-s="1" role="switch" aria-checked="true"><span><span data-i18n="snd"></span><small data-i18n="snd_d"></small></span><i></i></button></div>
<div class="card"><h2 data-i18n="h_lvl"></h2><div class="row" id="lv"></div></div>
<div class="card"><h2 data-i18n="h_mode"></h2><div class="modes" id="md"></div></div>
<div class="side">
<p class="rec" id="rec"></p>
<button class="cta" id="go" data-i18n="go"></button>
<!--online--><div class="card" id="top5box" hidden><h2 data-i18n="top5"></h2><div id="top5"></div></div><!--/online-->
<svg class="wave" viewBox="0 0 400 20" preserveAspectRatio="none" aria-hidden="true"><path d="M0 10C25 0 50 0 75 10S125 20 150 10 200 0 225 10 275 20 300 10 350 0 375 10T400 10" fill="none" stroke="currentColor"/></svg>
<select class="lang"></select>
<p class="cap">Principia Mathematica</p>
</div>
</section>
<section id="game">
<div class="top"><button class="ic" id="quit" data-i18n-aria="quit">✕</button><b id="stat"></b><span id="sc"></span><button class="ic" id="hb"></button><button class="ic" id="skip" data-i18n="skip"></button></div>
<div class="bar" id="bar"><i></i></div>
<aside class="panel" id="panel"><h2 data-i18n="panel"></h2>
<div><span data-i18n="k_ok"></span><b id="kok">0</b></div>
<div><span data-i18n="k_err"></span><b id="kerr">0</b></div>
<div><span data-i18n="k_st"></span><b id="kst">0</b></div>
<div><span data-i18n="k_avg"></span><b id="kavg">—</b></div>
<div><span data-i18n="k_hint"></span><b id="khint">0</b></div>
<p class="keys"><span data-i18n="keys1"></span><br><span data-i18n="keys2"></span></p></aside>
<div class="qc" id="qc"><div id="qt"></div><div id="an"></div><div id="st" aria-live="polite"></div><div id="hint" aria-live="polite"></div></div>
<div class="pad" id="pad"></div>
</section>
<section id="end" class="res">
<div><p class="sub" id="et"></p><div class="big g" id="eb"></div><p id="er"></p><!--online--><p class="sub" id="sent"></p><!--/online--></div>
<div class="stats" id="eg"></div>
<div class="card" id="rv"></div>
<button class="cta" id="again" data-i18n="again"></button>
<button id="share" data-i18n="share"></button>
<!--online--><a class="lk" href="ranking.html" data-i18n="see_rank"></a><!--/online-->
<button class="ghost" id="back" data-i18n="back"></button>
</section>
</main>
<script src="i18n.js"></script>
<script src="game.js"></script>
<!--online-->
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="mm.js"></script>
<script src="online.js"></script>
<!--/online-->
</body>
</html>
